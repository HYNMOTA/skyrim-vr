name: Build WinlatorXR Skyrim Quest 3S

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inject Skyrim Quest 3S Presets and Sign APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p workspace/assets/skyrim_quest3s_preset
          mkdir -p skyrim_quest3s_configs

          printf "[Display]\niSize W=1280\niSize H=720\nbFull Screen=1\nbBorderless=1\niVSyncPresentInterval=0\nfShadowDistance=1500.0000\niShadowMapResolution=512\niMaxAnisotropy=2\niMultiSample=0\nbFXAAEnabled=1\nbUseTAA=0\nfMeshLODLevel1FadeDist=3072.0000\nfMeshLODLevel2FadeDist=2048.0000\nfTreesMidLODSwitchDist=2500.0000\n\n[Grass]\nbAllowCreateGrass=0\nbAllowLoadGrass=0\n\n[Water]\nbUseWaterRefractions=0\nbUseWaterReflections=0\nbUseWaterDepth=0\n\n[VR]\nfVrScale=70.0000\nbUseWandDirectionalMovement=1\n\n[Particles]\niMaxDesired=250\n" > skyrim_quest3s_configs/SkyrimPrefs.ini

          printf "[General]\nsLanguage=RUSSIAN\nuExterior Cell Buffer=16\nbPreemptivelyUnloadCells=1\niPreloadSizeLimit=26214400\n\n[HAVOK]\nfMaxTime=0.0138\nfMaxTimeComplex=0.0277\n\n[Papyrus]\nfUpdateBudgetMS=1.2\nfExtraTaskletBudgetMS=1.2\nfPostLoadUpdateTimeMS=500.0\nbEnableLogging=0\nbEnableTrace=0\n" > skyrim_quest3s_configs/Skyrim.ini

          printf "dxvk.enableAsync = True\ndxvk.numCompilerThreads = 4\ndxvk.maxFrameLatency = 1\ndxvk.tearFree = False\nd3d9.maxFrameLatency = 1\nd3d11.maxFeatureLevel = 11_0\nd3d11.constantBufferRangeCheck = False\n" > skyrim_quest3s_configs/dxvk.conf

          printf "BOX64_DYNAREC_SAFEFLAGS=0\nBOX64_DYNAREC_FASTNAN=1\nBOX64_DYNAREC_FASTROUND=1\nBOX64_DYNAREC_X87DOUBLE=0\nBOX64_DYNAREC_BIGBLOCK=2\nBOX64_DYNAREC_STRONGMEM=1\nBOX64_DYNAREC_FORWARD=512\nBOX64_DYNAREC_CALLRET=1\nBOX64_AVX=0\nDXVK_ASYNC=1\nDXVK_STATE_CACHE=1\nMESA_NO_ERROR=1\nWINEESYNC=1\nWINEFSYNC=1\nXR_MODE=1\nXR_3D_MODE=1\n" > skyrim_quest3s_configs/quest3s_container.env

          cp skyrim_quest3s_configs/* workspace/assets/skyrim_quest3s_preset/

          LATEST_APK=$(python3 -c "import os, urllib.request, json; req = urllib.request.Request('https://api.github.com/repos/WinlatorXR/WinlatorXR/releases', headers={'User-Agent': 'Mozilla/5.0', 'Authorization': 'Bearer ' + os.environ['GH_TOKEN']}); data = json.loads(urllib.request.urlopen(req).read().decode()); print(next(a['browser_download_url'] for r in data for a in r.get('assets', []) if a['name'].endswith('.apk')))")
          echo "Downloading APK from: $LATEST_APK"
          curl -L "$LATEST_APK" -o workspace/base.apk

          cd workspace
          zip -r base.apk assets/skyrim_quest3s_preset/

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          "$BUILD_TOOLS/zipalign" -p -f -v 4 base.apk aligned.apk

          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          "$BUILD_TOOLS/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out ../WinlatorXR-Skyrim-Quest3S.apk aligned.apk

      - name: Upload Ready APK and Skyrim Configs
        uses: actions/upload-artifact@v4
        with:
          name: WinlatorXR-Skyrim-Quest3S-Bundle
          path: |
            WinlatorXR-Skyrim-Quest3S.apk
            skyrim_quest3s_configs/*
